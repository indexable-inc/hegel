# Copy into a crate's clippy.toml (or merge) to make it use hegel::sim's facade
# instead of the std items it replaces. Every replacement is std itself unless
# hegel-sim's `sim` feature is on, so production builds are unchanged.
disallowed-types = [
  { path = "std::sync::Mutex", reason = "use hegel::sim::sync::Mutex" },
  { path = "std::sync::MutexGuard", reason = "use hegel::sim::sync::MutexGuard" },
  { path = "std::sync::RwLock", reason = "use hegel::sim::sync::RwLock" },
  { path = "std::sync::Condvar", reason = "use hegel::sim::sync::Condvar" },
  { path = "std::sync::atomic::AtomicBool", reason = "use hegel::sim::sync::atomic::AtomicBool" },
  { path = "std::sync::atomic::AtomicU8", reason = "use hegel::sim::sync::atomic::AtomicU8" },
  { path = "std::sync::atomic::AtomicU16", reason = "use hegel::sim::sync::atomic::AtomicU16" },
  { path = "std::sync::atomic::AtomicU32", reason = "use hegel::sim::sync::atomic::AtomicU32" },
  { path = "std::sync::atomic::AtomicU64", reason = "use hegel::sim::sync::atomic::AtomicU64" },
  { path = "std::sync::atomic::AtomicUsize", reason = "use hegel::sim::sync::atomic::AtomicUsize" },
  { path = "std::sync::atomic::AtomicI32", reason = "use hegel::sim::sync::atomic::AtomicI32" },
  { path = "std::sync::atomic::AtomicI64", reason = "use hegel::sim::sync::atomic::AtomicI64" },
  { path = "std::sync::atomic::AtomicIsize", reason = "use hegel::sim::sync::atomic::AtomicIsize" },
  { path = "std::sync::atomic::AtomicPtr", reason = "use hegel::sim::sync::atomic::AtomicPtr" },
  { path = "std::sync::mpsc::Sender", reason = "use hegel::sim::sync::mpsc" },
  { path = "std::sync::mpsc::Receiver", reason = "use hegel::sim::sync::mpsc" },
  { path = "std::time::Instant", reason = "use hegel::sim::time::Instant" },
  { path = "std::time::SystemTime", reason = "use hegel::sim::time::SystemTime" },
  { path = "std::fs::File", reason = "use hegel::sim::fs::File" },
  { path = "std::fs::OpenOptions", reason = "use hegel::sim::fs::OpenOptions" },
  { path = "std::thread::JoinHandle", reason = "use hegel::sim::thread" },
]
disallowed-methods = [
  { path = "std::thread::spawn", reason = "use hegel::sim::thread::spawn" },
  { path = "std::thread::sleep", reason = "use hegel::sim::thread::sleep" },
  { path = "std::thread::yield_now", reason = "use hegel::sim::thread::yield_now" },
  { path = "std::thread::park", reason = "use hegel::sim::thread::park" },
  { path = "std::hint::spin_loop", reason = "use hegel::sim::hint::spin_loop" },
  { path = "std::sync::atomic::fence", reason = "use hegel::sim::sync::atomic::fence" },
  { path = "std::sync::mpsc::channel", reason = "use hegel::sim::sync::mpsc::channel" },
  { path = "std::sync::mpsc::sync_channel", reason = "use hegel::sim::sync::mpsc::sync_channel" },
  { path = "std::fs::read", reason = "use hegel::sim::fs::read" },
  { path = "std::fs::read_to_string", reason = "use hegel::sim::fs::read_to_string" },
  { path = "std::fs::write", reason = "use hegel::sim::fs::write" },
  { path = "std::fs::rename", reason = "use hegel::sim::fs::rename" },
  { path = "std::fs::remove_file", reason = "use hegel::sim::fs::remove_file" },
  { path = "std::fs::create_dir", reason = "use hegel::sim::fs::create_dir" },
  { path = "std::fs::create_dir_all", reason = "use hegel::sim::fs::create_dir_all" },
  { path = "std::fs::remove_dir", reason = "use hegel::sim::fs::remove_dir" },
  { path = "std::fs::remove_dir_all", reason = "use hegel::sim::fs::remove_dir_all" },
  { path = "std::fs::read_dir", reason = "use hegel::sim::fs::read_dir" },
  { path = "std::fs::metadata", reason = "use hegel::sim::fs::metadata" },
  { path = "std::process::exit", reason = "use hegel::sim::process::exit" },
]
